name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]
  # release-please.yml dispatches this on release-PR branches (GITHUB_TOKEN PRs do not
  # trigger pull_request runs); `test` then reports on the release PR's head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Conventional `type: subject` PR titles become the squash commit and feed release-please.
    # Skipped on push/dispatch; a skipped required check counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-commit classifier tests
        run: pnpm test:classify

      - name: Feature README validation (strict)
        run: pnpm validate:feature-docs:strict

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Version/changelog consistency
        run: pnpm validate:version-sync

      - name: Git workflow mode config
        run: pnpm validate:git-workflow

      - name: Structure validation
        run: pnpm validate:structure

      - name: Feature size validation
        run: pnpm validate:feature-size

      - name: Architecture check
        run: pnpm arch:check:ci

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build


